# Git hooks via lefthook (replaces husky + lint-staged).
#
# Install hooks: `bun install` runs `lefthook install` via the prepare script.
# Manual install: `bunx lefthook install`.
# Bypass once:    `git commit --no-verify` or `git push --no-verify`.

# post-checkout fires on every branch checkout, including `git worktree add`.
# The hook hardlinks node_modules from the canonical checkout into the new
# worktree so the first build doesn't take ~30sec re-downloading ~500MB of
# Obsidian/jest/esbuild deps. Script handles its own no-op cases (same dir,
# already populated, cross-filesystem). Args {0} {1} {2} = git's
# (prev-HEAD, new-HEAD, branch-flag).
post-checkout:
  jobs:
    - name: hardlink-node-modules
      run: bash .githooks/post-checkout {0} {1} {2}

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "{src,tests}/**/*.ts"
      run: bun biome check --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: tests-and-version-bump
      run: |
        if [ -n "${CI:-}" ] || [ -n "${GITHUB_ACTIONS:-}" ]; then
          exit 0
        fi

        # Fast path: skip `bun test` if no test-affecting files changed vs
        # origin/main. Doc-only / YAML-only PRs (which still must bump
        # package.json + manifest.json for the version check below) finish
        # the hook in seconds instead of ~8s of jest warm-up + run.
        #
        # Trigger set: TS source/tests, bun.lock (deps), tsconfig*.json,
        # esbuild.config.mjs, .githooks/*, and package.json *unless* the
        # only edit is its version line (mirrors the backend mix.exs strip).
        TEST_AFFECTING_REGEX='\.(ts|tsx)$|^bun\.lock$|^tsconfig.*\.json$|^esbuild\.config\.mjs$|^\.githooks/|^package\.json$'
        AFFECTING="$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E "$TEST_AFFECTING_REGEX" || true)"
        if [ "$(echo "$AFFECTING" | tr -d '\n ')" = "package.json" ]; then
          NON_VERSION_DIFF="$(git diff --unified=0 origin/main...HEAD -- package.json 2>/dev/null \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---) ' \
            | grep -vE '^[+-][[:space:]]*"version":[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+",?[[:space:]]*$' \
            || true)"
          [ -z "$NON_VERSION_DIFF" ] && AFFECTING=""
        fi
        if [ -z "$AFFECTING" ]; then
          echo "▸ Fast path: no test-affecting files changed vs origin/main — skipping bun test"
        else
          bun test
        fi

        current_branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$current_branch" = "main" ] || [ "$current_branch" = "HEAD" ]; then
          exit 0
        fi
        if ! git rev-parse --verify --quiet origin/main >/dev/null; then
          exit 0
        fi

        for file in package.json manifest.json; do
          branch_v=$(node -p "require('./$file').version" 2>/dev/null || true)
          main_v=$(git show "origin/main:$file" 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{console.log(JSON.parse(s).version)}catch(_){}})" \
            || true)
          if [ -n "$branch_v" ] && [ -n "$main_v" ] && [ "$branch_v" = "$main_v" ]; then
            cat >&2 <<EOF
        ✖ pre-push: $file version ($branch_v) has not been bumped from main.

          Bump with: npm version patch --no-git-tag-version
          (this updates package.json, manifest.json, versions.json together)

          To push WIP without bumping: git push --no-verify
        EOF
            exit 1
          fi
        done

        echo "✓ pre-push: plugin version differs from main"
