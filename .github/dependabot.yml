# Dependabot — managed by engram-infra/main/github/dependabot_config.tf.
# DO NOT EDIT IN-REPO; changes will be overwritten on next tf apply.
version: 2
updates:
  # Obsidian plugin (bun.lock — bun ecosystem, not npm).
  # `dependency-type: development` isn't valid for bun, so the
  # dev-minor split from the old npm config is collapsed into the
  # single patches group.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      plugin-minor:
        applies-to: version-updates
        update-types: [patch, minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    groups:
      gha-all:
        applies-to: version-updates
        update-types: [patch, minor]
