name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']   # plain semver = stable only; excludes -beta./-pr.

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # App token so the versions.json push-back to protected main succeeds.
          token: ${{ steps.app-token.outputs.token }}

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing: $VERSION"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "Release ${VERSION} already exists — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up RC tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Previous version on main (before this merge) — catches RCs
          # created before a mid-PR version bump (e.g. 0.8.6-rc.* when
          # releasing 0.8.7).
          PREV_VERSION=$(git show HEAD~1:manifest.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")

          RELEASES_JSON=$(curl --fail -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")

          for v in "$VERSION" "$PREV_VERSION"; do
            [ -z "$v" ] && continue
            echo "Cleaning up ${v}-rc.* releases"
            echo "$RELEASES_JSON" \
              | jq -r --arg prefix "${v}-rc." '.[] | select(.tag_name | startswith($prefix)) | "\(.id) \(.tag_name)"' \
              | while read -r id tag; do
                  [ -z "$id" ] && continue
                  echo "  Deleting release: $tag (id=$id)"
                  curl --fail -sS -X DELETE \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${{ github.repository }}/releases/${id}" || true
                done
          done

          # Safety net: delete any orphaned RC git tags for both versions
          git fetch --tags
          for v in "$VERSION" "$PREV_VERSION"; do
            [ -z "$v" ] && continue
            git tag -l "${v}-rc.*" | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "  Deleting orphaned tag: $tag"
              git push origin ":refs/tags/$tag" 2>/dev/null || true
            done
          done

      - name: Create GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(printf 'Release %s' "$VERSION")
          BODY=$(jq -nc --arg tag "$VERSION" --arg name "$VERSION" --arg notes "$NOTES" \
            '{tag_name: $tag, name: $name, body: $notes, prerelease: false, draft: false, generate_release_notes: true}')
          RELEASE=$(curl --fail -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$BODY")
          UPLOAD_URL=$(echo "$RELEASE" | jq -r '.upload_url' | sed 's/{?name,label}//')
          for asset in main.js manifest.json styles.css; do
            curl --fail -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              "${UPLOAD_URL}?name=${asset}" > /dev/null
          done
          echo "Released $VERSION with main.js manifest.json styles.css"

      - name: Verify release flags
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          META=$(curl --fail -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}")
          PRERELEASE=$(echo "$META" | jq -r '.prerelease')
          DRAFT=$(echo "$META" | jq -r '.draft')
          if [ "$PRERELEASE" != "false" ] || [ "$DRAFT" != "false" ]; then
            echo "::error::Stable release ${VERSION} has prerelease=$PRERELEASE draft=$DRAFT (expected false/false)"
            exit 1
          fi
          echo "Verified ${VERSION} is published as stable (prerelease=false, draft=false)"

      - name: Ensure versions.json has this version
        # Updates versions.json on main via the Contents API (not `git push
        # origin HEAD:main`): main is protected, and the checked-out TAG
        # commit's history is not guaranteed fast-forward with main (release-please
        # pushes to main independently), so a raw push-of-HEAD can silently
        # no-op or reject. Compare-on-sha PUT is atomic and works regardless
        # of where main has moved; retries once on a concurrent-update 409.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MIN=$(jq -r '.minAppVersion' manifest.json)
          API="https://api.github.com/repos/${{ github.repository }}/contents/versions.json"

          for attempt in 1 2; do
            RESP=$(curl --fail -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}?ref=main")
            SHA=$(echo "$RESP" | jq -r '.sha')
            CONTENT=$(echo "$RESP" | jq -r '.content' | base64 -d)

            if [ "$(echo "$CONTENT" | jq --arg v "$VERSION" 'has($v)')" = "true" ]; then
              echo "versions.json already has ${VERSION} on main — skipping"
              break
            fi

            NEW_CONTENT_B64=$(echo "$CONTENT" | jq --arg v "$VERSION" --arg m "$MIN" '.[$v]=$m' | base64 -w0)
            BODY=$(jq -nc \
              --arg msg "chore(release): versions.json ${VERSION} [skip ci]" \
              --arg content "$NEW_CONTENT_B64" \
              --arg sha "$SHA" \
              '{message: $msg, content: $content, sha: $sha, branch: "main"}')

            HTTP_STATUS=$(curl -sS -o /tmp/versions-put-response.json -w '%{http_code}' -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" -d "$BODY")

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
              echo "Updated versions.json on main with ${VERSION}"
              break
            elif [ "$HTTP_STATUS" = "409" ] && [ "$attempt" = "1" ]; then
              echo "sha conflict updating versions.json — retrying"
              continue
            else
              echo "::error::Failed to update versions.json (HTTP $HTTP_STATUS): $(cat /tmp/versions-put-response.json)"
              exit 1
            fi
          done

      - name: Announce to Discord (#releases)
        if: steps.check.outputs.exists != 'true' && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(gh release view "$VERSION" --repo "${{ github.repository }}" --json body -q .body || echo "")
          CONTENT=$(printf '**Engram Vault Sync %s** released.\n\n%s' "$VERSION" "$NOTES")
          curl -sS -X POST -H 'Content-Type: application/json' --max-time 5 \
            --data "$(jq -nc --arg c "$CONTENT" '{content:$c}')" "$WEBHOOK"
