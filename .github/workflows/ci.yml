name: CI

on:
  push:
    branches: ["**"]
    # No tag should start CI — every tag we push points at a commit this
    # workflow already gated on its branch. This was ["v*"], which missed
    # release-please's own tag: release-please-config.json sets
    # include-v-in-tag=false, so it publishes BARE semver (1.18.1, no v) and
    # every release quietly ran a second full CI on head_branch=<version>.
    # "**" is exhaustive and needs no upkeep when a new tag shape appears.
    # (pr-build.yml's <version>-pr.<n>.<sha> preview tags are created through
    # the releases API with GITHUB_TOKEN, so they never triggered this anyway.)
    tags-ignore: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - uses: actions/checkout@v7

      - run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit

      - name: Lint (biome)
        run: bunx biome check src tests

      - name: Lint (Obsidian community reviewer rules)
        run: bun run lint:obsidian

      - name: Lint CSS (stylelint, mirrors dashboard CSS checks)
        run: bun run lint:css

      - name: Type-check and build
        run: bun run build

      # Deterministic CRDT convergence sim — fast-fails a convergence regression
      # with clear attribution before it's buried in the full suite. Proven
      # differential gate for #282 (seq fence); see tests/sim/README.md.
      - name: Sim convergence tier
        run: bun test tests/sim/

      - name: Run tests
        run: bun test

  # Trigger backend E2E after plugin passes — tests full Obsidian ↔ backend sync
  trigger-e2e:
    needs: build-and-test
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ENGRAM_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENGRAM_CI_APP_PRIVATE_KEY }}
          owner: engram-app
          repositories: Engram

      - name: Trigger backend E2E
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/engram-app/Engram/dispatches \
            -d '{"event_type":"plugin-e2e-trigger","client_payload":{"plugin_ref":"${{ github.sha }}","plugin_branch":"${{ github.ref_name }}"}}'
