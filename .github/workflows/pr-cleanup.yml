name: PR preview cleanup

# When a PR closes or merges, delete every preview release + tag it minted.
# Paired with the "Prune superseded previews" step in pr-build.yml (which keeps
# only the latest build per OPEN PR), this leaves at most one preview per open
# PR and zero for closed/merged ones — so the releases page stays readable
# instead of accumulating one build per commit forever.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - uses: actions/checkout@v7

      - name: Delete this PR's preview releases + tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Match this PR's preview tags: <version>-pr.<PR_NUM>.<sha> and the
          # sha-less form <version>-pr.<PR_NUM>. The (\.|$) boundary after the
          # number stops PR 28 from matching PR 284's tags.
          SH=.github/scripts/prereleases.sh
          chmod +x "$SH"
          "$SH" for-pr "$PR_NUM" | "$SH" delete
