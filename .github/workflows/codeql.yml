    # CodeQL — managed by engram-infra/main/github/codeql.tf.
    # DO NOT EDIT IN-REPO; changes will be overwritten on next tf apply.
    name: codeql

    on:
      # NO `push: [main]`. A squash-merge re-scans the exact tree the PR just
      # scanned — CodeQL was ~121 runner-min/week on Engram-obsidian alone,
      # nearly all of it re-analysing unchanged code. PRs are still gated, so
      # nothing reaches main unscanned.
      #
      # TRADE-OFF, understood and accepted: code-scanning alerts on the default
      # branch are populated by `push` events, so the Security tab's baseline
      # now refreshes on the weekly cron rather than on every merge. Worst case
      # an alert introduced just after a Monday run shows on its PR but does not
      # appear in the default-branch alert list until the next Monday.
      # Re-add `push: [main]` here if per-merge baseline freshness is ever
      # needed more than the runner time.
      pull_request:
        branches: [main]
      schedule:
        # Weekly scan against unchanged code — catches newly-published
        # advisories that match dependencies already on main, AND refreshes the
        # default-branch baseline now that `push` no longer does.
        - cron: "0 8 * * 1"

    permissions:
      actions: read
      contents: read
      security-events: write

    jobs:
      analyze:
        name: analyze (javascript-typescript)
        # Self-hosted runner pool (engram-runners VM, runner-1..7). Switched from
        # ubuntu-latest 2026-06-01 to cut billable Linux minutes — language
        # toolchains are either preinstalled (bun + node 22 for js/ts) or set up
        # in-job (setup-go below for go).
        runs-on: [self-hosted, linux, x64, isolated]
        steps:
          - uses: actions/checkout@v7
          - uses: github/codeql-action/init@v4
            with:
              languages: javascript-typescript
          - uses: github/codeql-action/autobuild@v4
          - uses: github/codeql-action/analyze@v4
