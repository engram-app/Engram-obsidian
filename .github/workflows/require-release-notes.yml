name: Require Release Notes

on:
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes this run: cancel it instead of
# letting it fail. release-please force-pushes a second commit seconds after
# the first, and the first run's checkout of its dead merge ref failed
# ("not our ref"), 23 red plugin runs in 14 days.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  require-notes:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - uses: actions/checkout@v7
      - name: Assert CHANGELOG has notes for this version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' manifest.json)
          SECTION=$(awk -v v="$VERSION" '
            substr($0,1,length("## [" v "]")) == "## [" v "]" { grab=1; next }
            substr($0,1,length("## " v " ")) == "## " v " "  { grab=1; next }
            /^## / {grab=0}
            grab {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$SECTION" | grep -v '^[[:space:]]*$' || true)" ]; then
            echo "::error::CHANGELOG.md has no notes under ## $VERSION — write release notes before merging."
            exit 1
          fi
          echo "Release notes present for $VERSION."
